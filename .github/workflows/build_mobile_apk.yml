name: Compilar APK Android (Colegio GRM II)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build_mobile_apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias de Flutter
        working-directory: ./mobile
        run: flutter pub get

      - name: Compilar APK de Producción
        working-directory: ./mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Colegio_GRM_Tutor_Release_APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
