version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: siscol_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: colegio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - siscol_pgdata:/var/lib/postgresql/data
    networks:
      - siscol_network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: siscol_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-prod-key-grm-2026}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "siscol360.cloud,www.siscol360.cloud,localhost,127.0.0.1"
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/colegio
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    depends_on:
      - postgres
    networks:
      - siscol_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: siscol_frontend
    restart: unless-stopped
    ports:
      - "172.17.0.1:8090:80"
      - "127.0.0.1:8090:80"
    depends_on:
      - backend
    networks:
      - siscol_network

volumes:
  siscol_pgdata:

networks:
  siscol_network:
    driver: bridge
