version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: grm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: colegio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - grm_network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: grm_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-prod-key-grm-2026}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/colegio
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    networks:
      - grm_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: grm_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - grm_network

volumes:
  pgdata:

networks:
  grm_network:
    driver: bridge
